# Memory settings tested with the shop's API and frontend.
shared_buffers = 32MB
max_connections = 20
work_mem = 2MB
maintenance_work_mem = 16MB
autovacuum_max_workers = 2
max_wal_size = 256MB

# Require encrypted TCP connections, including pgAdmin.
listen_addresses = '*'
ssl = on
ssl_cert_file = '/var/lib/postgresql/data/server.crt'
ssl_key_file = '/var/lib/postgresql/data/server.key'
hba_file = '/etc/postgresql/pg_hba.conf'
