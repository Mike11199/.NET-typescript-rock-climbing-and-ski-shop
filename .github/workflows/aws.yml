name: Deploy Alpine Peak CDK production service

on:
  push:
    branches:
      - api-v2-dotnet-conversion
  workflow_dispatch:

permissions:
  contents: read

# One release at a time. A newer push waits rather than cancelling a deployment
# that is already replacing a healthy ECS task.
concurrency:
  group: alpine-peak-release
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  CDK_CLI_VERSION: 2.1139.0
  ECR_REPOSITORY: ski-rock-climbing-shop

jobs:
  cdk-test:
    name: cdk-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Run tests
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          uv run pytest

  cdk-synth:
    name: cdk-synth
    needs: cdk-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Synthesize production stack
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          echo "--- CDK SYNTH ---"
          cdk synth AlpinePeakStack > /dev/null 2>&1 && echo "Synthesis passed."

  cdk-diff:
    name: cdk-diff
    needs: cdk-synth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Diff production stack against current deployment
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          echo "--- CDK DIFF (changes to deploy) ---"
          cdk diff AlpinePeakStack || true

  build-docker-images:
    name: build-docker-images
    needs: cdk-diff
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Temporary credential path. Move to GitHub OIDC after a narrowly
          # scoped AWS deploy role is created and separately audited.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists (idempotent)
        run: |
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" || true

      - name: Build and push immutable frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: front-${{ github.sha }}
        working-directory: frontend
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Build and push immutable Express API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: api-v1-${{ github.sha }}
        working-directory: backend_v2_socket_io_api
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Build and push immutable .NET API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: api-v2-${{ github.sha }}
        working-directory: backend_v2_dotnet
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


  cdk-deploy:
    name: cdk-deploy
    needs: build-docker-images
    runs-on: ubuntu-latest
    environment: production

    # This creates/updates only AlpinePeakStack. It does not change the
    # shared ALB, listener, Route 53 record, or ACM certificate. Requires prior CDK bootstrap.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Deploy production service with this commit's image tag
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          cdk deploy AlpinePeakStack \
            --require-approval never \
            --parameters ImageTag=${{ github.sha }}
