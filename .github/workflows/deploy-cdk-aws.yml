name: Deploy Alpine Peak CDK production service

on:
  push:
    branches:
      - api-v2-dotnet-conversion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpine-peak-release
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CDK_CLI_VERSION: 2.1139.0
  ECR_REPOSITORY: ski-rock-climbing-shop

jobs:
  cdk-test:
    name: cdk-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock
      - name: Run tests
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          uv run pytest

  deploy-repository:
    name: deploy-repository
    needs: cdk-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock
      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"
      - name: Deploy retained ECR repository
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          cdk deploy AlpinePeakRepositoryStack --require-approval never

  build-docker-images:
    name: build-docker-images
    needs: deploy-repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: front-end-${{ github.sha }}
        working-directory: frontend
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Build and push immutable Express API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: back-end-express-socket-io-api-${{ github.sha }}
        working-directory: backend_v2_socket_io_api
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Build and push immutable .NET API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: back-end-dotnet-api-${{ github.sha }}
        working-directory: backend_v2_dotnet
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy-application:
    name: deploy-application
    needs: build-docker-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock
      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"
      - name: Deploy application with this commit's image tag
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          cdk deploy AlpinePeakStack \
            --revert-drift \
            --require-approval never \
            --parameters ImageTag=${{ github.sha }}
